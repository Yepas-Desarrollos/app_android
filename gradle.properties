org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optimizaciones para KAPT y Hilt con Kotlin 2.2.20
kapt.incremental=false
kapt.use.worker.api=true
# Deshabilitar procesamiento de metadatos de Kotlin que cause conflictos
kotlin.build.report.json.directory=build/kotlin-build-reports
# Habilitar build cache solo si es necesario
org.gradle.build.cache=false

